[workspace]
resolver = "2"
members = [
    "crates/stitch-wire-core",
    "crates/stitch-wire",
    "adapters/stitch-wire-adapter-udp",
    "adapters/stitch-wire-adapter-tokio",
    "adapters/stitch-wire-adapter-std",
    "adapters/stitch-wire-adapter-c",
    "adapters/stitch-wire-adapter-wasm",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Stitch Contributors", "GoldSrc Architecture Team"]
repository = "https://github.com/stitch-rs/stitch-wire"

[workspace.dependencies]
stitch-wire-core = { path = "crates/stitch-wire-core", default-features = false }
stitch-wire = { path = "crates/stitch-wire", default-features = false }
stitch-core = { git = "https://github.com/stitch-rs/stitch-framework.git", branch = "dev", default-features = false }
stitch-macros = { git = "https://github.com/stitch-rs/stitch-framework.git", branch = "dev", default-features = false }
stitch-data = { git = "https://github.com/stitch-rs/stitch-data.git", branch = "dev", default-features = false, features = ["std", "derive"] }
wire-ring = { git = "https://github.com/ulquiorracode/wire-ring-rs.git", branch = "dev", default-features = false }

zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
crc32fast = { version = "1.4", default-features = false }
criterion = { version = "0.8", default-features = false }

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
