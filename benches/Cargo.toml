[package]
name = "stitch-wire-benches"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
stitch-wire = { workspace = true, features = ["std", "data"] }
criterion = { workspace = true }
rayon = "1.12.0"

[lib]
name = "stitch_wire_benches"
path = "src/lib.rs"

[[bench]]
name = "wire"
path = "benches/wire_bench.rs"
harness = false

[[bench]]
name = "parallel_transfer"
path = "benches/parallel_transfer_bench.rs"
harness = false
